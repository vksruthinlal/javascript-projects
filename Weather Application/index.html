
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-card">
        <h1>Weather Application</h1>
        <p>Check the weather for a city.</p>

        <form id="weather-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <section id="weather-result" aria-live="polite">
            <h2 id="city-name">Weather Details</h2>
            <p id="temperature">Enter a city to check its weather.</p>
            <p id="description"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
